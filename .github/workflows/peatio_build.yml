name: Build Peatio Exchange APK

on:
  push:
    branches: [ "main", "master", "develop" ] # Jis branch par aap push karein
  pull_request:
    branches: [ "main", "master" ]

jobs:
  compile-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clone Code Repository
      uses: actions/checkout@v4

    - name: 2. Java Runtime Environment Setup (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' # Peatio components dependencies ke liye compatible standard
        cache: 'gradle'

    - name: 3. Grant Permissions to System Builder
      run: chmod +x gradlew

    - name: 4. Compile Premium Native Code to APK
      run: ./gradlew assembleDebug --stacktrace

    - name: 5. Generate and Export APK Download Link
      uses: actions/upload-artifact@v4
      with:
        name: Peatio-Exchange-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
